name: run-llm
channels:
  - conda-forge
  - nvidia
dependencies:
  # Python + uv come from conda so the conda env is self-contained.
  - python=3.12
  - uv>=0.10
  # CUDA toolkit 12.9.x: provides nvcc, libcuda.so stub, headers needed by
  # vLLM/flashinfer JIT-compilation. Runtime CUDA libs (cudart, cublas, cudnn,
  # cufft, ...) come from the nvidia-* pip packages pulled in by torch/vllm
  # into .venv, so we only need the toolkit/driver dev bits here.
  - cuda-toolkit=12.9.*
