[project]
name = "run-llm"
version = "0.1.0"
description = "Host LLM using vLLM with OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vllm",
]

[project.scripts]
run-llm = "main:main"

[tool.uv]
index-strategy = "unsafe-best-match"
# Pin torch to the system-proven cu128 version; vLLM's torch requirement is intentionally overridden.
override-dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
]

# torch: install from CUDA 12.8 PyTorch index
[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"
name = "pytorch-cu128"
explicit = true

# vllm: install from the cu129 nightly wheel server (links libcudart.so.12 — works on CUDA 12.8)
[[tool.uv.index]]
url = "https://wheels.vllm.ai/nightly/cu129/"
name = "vllm-cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
vllm = { index = "vllm-cu129" }
